name: Deploy pma-viewer to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pma-viewer/**'
      - '.github/workflows/deploy-pma-viewer.yml'

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROJECT_NAME: draw-ds-cc

defaults:
  run:
    working-directory: pma-viewer

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pma-viewer/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Ensure Pages project exists
        run: npx wrangler pages project create "$PROJECT_NAME" --production-branch=main 2>&1 || true

      - name: Deploy
        run: npx wrangler pages deploy apps/site/dist --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true
