name: Release pma-viewer

on:
  push:
    tags:
      - 'pma-viewer-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. pma-viewer-v0.1.1)'
        required: true

defaults:
  run:
    working-directory: pma-viewer

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pma-viewer/pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter=@zzci/pma-viewer build

      - name: Pack tarball + zip dist
        working-directory: pma-viewer/packages/viewer
        run: |
          mkdir -p ../../release-artifacts
          pnpm pack --pack-destination ../../release-artifacts
          cp -r dist ../../release-artifacts/pma-viewer-dist
          (cd ../../release-artifacts/pma-viewer-dist && zip -r ../pma-viewer-dist.zip .)
          ls -la ../../release-artifacts

      - name: Publish to npm
        working-directory: pma-viewer/packages/viewer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            pma-viewer/release-artifacts/*.tgz
            pma-viewer/release-artifacts/pma-viewer-dist.zip
          body: |
            ## Install

            **npm:**
            ```bash
            npm i @zzci/pma-viewer
            # or
            pnpm add @zzci/pma-viewer
            ```

            **Browser via jsDelivr CDN (from npm):**
            ```html
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@zzci/pma-viewer/dist/style.css" />
            <script src="https://cdn.jsdelivr.net/npm/@zzci/pma-viewer/dist/pma-viewer.umd.js"></script>
            ```

            **ESM:**
            ```html
            <script type="module">
              import { mount } from 'https://cdn.jsdelivr.net/npm/@zzci/pma-viewer/dist/pma-viewer.js';
            </script>
            ```

            ## Assets

            - `*.tgz` — npm-packed tarball (same bytes published to registry)
            - `pma-viewer-dist.zip` — raw build output (ESM + CJS + UMD + types + CSS)
