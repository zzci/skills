name: Release pma-viewer

on:
  push:
    tags:
      - 'pma-viewer-v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: pma-viewer

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pma-viewer/pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter=@zzci/pma-viewer build

      - name: Publish to npm
        working-directory: pma-viewer/packages/viewer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
