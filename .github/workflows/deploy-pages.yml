name: Deploy pma-viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pma-viewer/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: pma-viewer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pma-viewer/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build site with /skills/ base
        working-directory: pma-viewer/apps/site
        env:
          PAGES_BASE: /skills/
        run: |
          pnpm --filter=@zzci/pma-viewer build
          pnpm --filter=pma-viewer-site build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pma-viewer/apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
